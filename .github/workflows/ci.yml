name: ci

on:
  push:
    branches: ["main", "exec/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: repository invariants
        run: node scripts/check-invariants.ts
