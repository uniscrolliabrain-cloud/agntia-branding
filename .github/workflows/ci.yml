name: ci

on:
  push:
    branches: ["main", "exec/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: repository invariants
        run: node scripts/check-invariants.ts

  # Row-level security is proven against a real PostgreSQL cluster, not by reading
  # the schema. REQUIRE_DB=1 turns a silent skip into a failure.
  db:
    runs-on: ubuntu-latest
    env:
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: rls integration
        run: npm run test:db

  # A build that compiles is not a package somebody can install. This job packs
  # the tarball, installs it into an empty project and runs the installed CLI and
  # an ESM import from node_modules.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: tarball install smoke
        run: node scripts/package-smoke.ts
